$kind: http-request
description: Devuelve recuentos de operaciones registradas/anuladas, importe de operaciones no anuladas, ventas del día y cinco productos más vendidos. Solo Admin.
url: "{{baseUrl}}/reportes/ventas"
method: GET
headers:
  Authorization: Bearer {{tokenAdmin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Reporte de ventas responde 200', function () { pm.response.to.have.status(200); });
      pm.test('Incluye resumen y productos más vendidos', function () { const data = pm.response.json(); pm.expect(data.resumen).to.be.an('object'); pm.expect(data.productos_mas_vendidos).to.be.an('array'); });
    language: text/javascript
order: 30000
