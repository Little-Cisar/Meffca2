$kind: http-request
url: "{{baseUrl}}/admin/protagonistas/{{protagonistId}}/verificacion"
method: PATCH
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado_verificacion": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Verificación administrativa responde 200', function () { pm.response.to.have.status(200); });
      pm.test('El perfil queda verificado', function () { pm.expect(pm.response.json().protagonista.estado_verificacion).to.eql(true); });
    language: text/javascript
order: 10000
