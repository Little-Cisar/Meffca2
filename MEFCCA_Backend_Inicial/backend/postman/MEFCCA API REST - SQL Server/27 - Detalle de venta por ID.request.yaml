$kind: http-request
description: Solo accesible al vendedor propietario, al comprador vinculado o a un administrador.
url: "{{baseUrl}}/ventas/{{saleId}}"
method: GET
headers:
  Authorization: Bearer {{tokenProtagonista}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Detalle de venta responde 200', function () { pm.response.to.have.status(200); });
      pm.test('Incluye cabecera y detalle', function () { const data = pm.response.json(); pm.expect(data.venta.id_venta).to.exist; pm.expect(data.detalles).to.be.an('array'); });
    language: text/javascript
order: 27000
