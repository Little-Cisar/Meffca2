$kind: http-request
description: Requiere tokenAdmin obtenido al iniciar sesión con una cuenta Admin.
url: "{{baseUrl}}/reportes/interacciones"
method: GET
headers:
  Authorization: Bearer {{tokenAdmin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Reporte responde correctamente', function () { pm.response.to.have.status(200); });
      pm.test('El reporte incluye resumen y lista', function () { const data = pm.response.json().reporte; pm.expect(data.resumen).to.be.an('object'); pm.expect(data.interacciones).to.be.an('array'); });
    language: text/javascript
order: 21000
