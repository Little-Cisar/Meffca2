$kind: http-request
description: Solo anula una venta registrada y restaura existencias en una sola transacción. Se puede ejecutar una sola vez.
url: "{{baseUrl}}/ventas/{{saleId}}/anular"
method: PATCH
headers:
  Authorization: Bearer {{tokenProtagonista}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Venta anulada (200)', function () { pm.response.to.have.status(200); });
      pm.test('Confirma estado anulado', function () { pm.expect(pm.response.json().estado).to.eql('Anulada'); });
    language: text/javascript
order: 29000
