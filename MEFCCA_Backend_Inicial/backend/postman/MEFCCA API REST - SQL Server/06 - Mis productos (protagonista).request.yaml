$kind: http-request
url: "{{baseUrl}}/productos/mios"
method: GET
headers:
  Authorization: Bearer {{tokenProtagonista}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mis productos responde 200', function () { pm.response.to.have.status(200); });
      pm.test('La respuesta contiene una lista', function () { pm.expect(pm.response.json().productos).to.be.an('array'); });
    language: text/javascript
order: 13000
