$kind: http-request
url: "{{baseUrl}}/productos/{{productId}}"
method: PUT
headers:
  Authorization: Bearer {{tokenProtagonista}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre_producto": "Taza artesanal de prueba editada",
      "id_categoria": {{categoryId}},
      "descripcion": "Descripción actualizada para comprobar PUT.",
      "precio": 275.00,
      "imagen": null,
      "stock_actual": 8
    }
scripts:
  - type: afterResponse
    code: pm.test('Producto actualizado (200)', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 16000
