$kind: http-request
url: "{{baseUrl}}/productos?limit=20&orden=recientes"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Catálogo responde 200', function () { pm.response.to.have.status(200); });
      pm.test('La respuesta contiene productos y paginación', function () { const data = pm.response.json(); pm.expect(data.productos).to.be.an('array'); pm.expect(data.paginacion).to.be.an('object'); });
    language: text/javascript
order: 3000
